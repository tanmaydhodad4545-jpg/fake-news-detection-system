<!DOCTYPE html>
<html>
<head>
    <title>History</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

<div class="container">

<h1>Prediction History</h1>

<table>

<tr>
    <th>ID</th>
    <th>News</th>
    <th>Result</th>
    <th>Date</th>
</tr>


{% for item in predictions %}

<tr>
    <td>{{ item[0] }}</td>
    <td>{{ item[1] }}</td>
    <td>{{ item[2] }}</td>
    <td>{{ item[3] }}</td>
</tr>

{% endfor %}

</table>


<a href="/">
    Back Home
</a>

</div>

</body>
</html>
